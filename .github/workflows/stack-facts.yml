name: stack-facts

on:
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/js/registry.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/DIRECTION_BRIEF.md"
      - "operator/PASS_BARS.md"
  pull_request:
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/js/registry.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/DIRECTION_BRIEF.md"
      - "operator/PASS_BARS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stack-facts:
    name: verify-stack-facts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rotting-facts harness
        # Local checks are hard gates. Network drift probes use the same public
        # Node, npm, and AAIF channels named by the canonical install page.
        run: python .github/scripts/verify-stack-facts.py
