name: stack-facts

on:
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/blocks/p3.html"
      - "site/blocks/hcp.html"
      - "site/blocks/p2.html"
      - "site/blocks/p8.html"
      - "site/assets/blocks/p3/**"
      - "site/js/registry.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/**"
  pull_request:
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/blocks/p3.html"
      - "site/blocks/hcp.html"
      - "site/blocks/p2.html"
      - "site/blocks/p8.html"
      - "site/assets/blocks/p3/**"
      - "site/js/registry.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stack-facts:
    name: verify-stack-facts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: instruments/p3_mcp_evidence/package-lock.json

      - name: Run rotting-facts harness
        # Local checks are hard gates. Network drift probes use the same public
        # Node, npm, and AAIF channels named by the canonical install page.
        run: python .github/scripts/verify-stack-facts.py

      - name: Smoke-test the P2 release-control plugin
        run: python instruments/p2_control_plane/starter/plugins/p2-release-control/tests/smoke_test.py

      - name: Verify the P2 package wiring
        run: python instruments/p2_control_plane/starter/plugins/p2-release-control/tests/verify_package.py

      - name: Smoke-test the P3 MCP evidence boundary
        working-directory: instruments/p3_mcp_evidence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run smoke
          npm audit --omit=dev

  verify-p3-mcp-windows:
    name: verify-p3-mcp-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: instruments/p3_mcp_evidence/package-lock.json

      - name: Install locked MCP dependencies
        working-directory: instruments/p3_mcp_evidence
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Smoke-test the PowerShell 5.1 project configuration
        working-directory: instruments/p3_mcp_evidence
        run: npm run configure-smoke

  verify-p2-control-plane-windows:
    name: verify-p2-control-plane-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke-test the isolated P2 bootstrap
        shell: powershell
        run: |
          $p1Source = Join-Path $env:RUNNER_TEMP "Completed P1 with spaces"
          New-Item -ItemType Directory -Path $p1Source | Out-Null
          Copy-Item ".\mission_flesh\p1\*" $p1Source -Recurse -Force
          Set-Content -LiteralPath (Join-Path $p1Source "SOURCE_MANIFEST.md") -Encoding UTF8 -Value "# Source manifest`n`n- C1: corpus/C1_release_notes.md`n- C2: corpus/C2_oncall.md"
          Set-Content -LiteralPath (Join-Path $p1Source "AUDIT.md") -Encoding UTF8 -Value "# Audit`n`nP1 release checks complete."
          Set-Content -LiteralPath (Join-Path $p1Source "RELEASE_RECORD.md") -Encoding UTF8 -Value "# Release record`n`nDecision: RELEASE"

          $target = Join-Path $env:RUNNER_TEMP "P2 Control Plane with spaces"
          .\instruments\p2_control_plane\bootstrap.ps1 -P1Source $p1Source -Destination $target
          $required = @(
            "AGENTS.md",
            "HARNESS_PROFILE.md",
            "P2_CONTROL_PLANE.json",
            ".agents\skills\daily-brief-release\SKILL.md",
            ".agents\plugins\marketplace.json",
            ".codex\config.toml",
            ".codex\agents\evidence_scout.toml",
            ".codex\agents\docs_researcher.toml",
            ".codex\agents\decision_reviewer.toml",
            "plugins\p2-release-control\hooks\quality_gate.py",
            "inputs\p1\corpus\C1_release_notes.md",
            "inputs\p1\SOURCE_MANIFEST.md",
            "inputs\p1\AUDIT.md",
            "inputs\p1\RELEASE_RECORD.md"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $relative))) {
              throw "P2 bootstrap missing $relative"
            }
          }
          $agentFiles = @(Get-ChildItem -LiteralPath (Join-Path $target ".codex\agents") -Filter "*.toml")
          if ($agentFiles.Count -ne 3) {
            throw "P2 bootstrap should contain exactly three custom agents; found $($agentFiles.Count)"
          }
          $docsAgent = Get-Content -LiteralPath (Join-Path $target ".codex\agents\docs_researcher.toml") -Raw
          if ($docsAgent -notmatch "https://developers.openai.com/mcp") {
            throw "P2 bootstrap lost the official Developer Docs MCP server"
          }
          if (Test-Path -LiteralPath (Join-Path $target "HOME_REFERENCE.md")) {
            throw "P2 bootstrap still contains the retired endpoint reference"
          }
          $refused = $false
          try {
            .\instruments\p2_control_plane\bootstrap.ps1 -P1Source $p1Source -Destination $target
          } catch {
            $refused = $true
          }
          if (-not $refused) {
            throw "P2 bootstrap overwrote an existing project"
          }

          $incompleteP1 = Join-Path $env:RUNNER_TEMP "Incomplete P1"
          New-Item -ItemType Directory -Path (Join-Path $incompleteP1 "corpus") -Force | Out-Null
          $badTarget = Join-Path $env:RUNNER_TEMP "P2 should not exist"
          $failed = $false
          try {
            .\instruments\p2_control_plane\bootstrap.ps1 -P1Source $incompleteP1 -Destination $badTarget
          } catch {
            $failed = $true
          }
          if (-not $failed -or (Test-Path -LiteralPath $badTarget)) {
            throw "P2 bootstrap created a final project from incomplete P1 evidence"
          }

      - name: Verify the P2 package wiring
        run: python instruments/p2_control_plane/starter/plugins/p2-release-control/tests/verify_package.py

      - name: Run the exact Windows hook command from a path with spaces
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "P2 Control Plane with spaces"
          $env:PLUGIN_ROOT = Join-Path $target "plugins\p2-release-control"
          $eventPath = Join-Path $env:RUNNER_TEMP "p2 stop event.json"
          $eventJson = @{ cwd = $target; stop_hook_active = $false } | ConvertTo-Json -Compress
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($eventPath, $eventJson, $utf8NoBom)
          $command = 'type "' + $eventPath + '" | py -3 "%PLUGIN_ROOT%\hooks\quality_gate.py"'
          $output = & cmd.exe /D /S /C $command
          if ($LASTEXITCODE -ne 0) {
            throw "Windows hook command exited $LASTEXITCODE`: $output"
          }
          $parsed = $output | ConvertFrom-Json
          if ($null -eq $parsed -or @($parsed.PSObject.Properties).Count -ne 0) {
            throw "Disabled Windows hook should return an empty object; got: $output"
          }

      - name: Smoke-test the P2 release-control hook
        run: python instruments/p2_control_plane/starter/plugins/p2-release-control/tests/smoke_test.py
