name: stack-facts

on:
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/blocks/p3.html"
      - "site/blocks/hcp.html"
      - "site/blocks/p2.html"
      - "site/blocks/pi.html"
      - "site/blocks/p8.html"
      - "site/assets/blocks/pi/**"
      - "site/assets/course/course-progression.svg"
      - "site/assets/blocks/p3/**"
      - "site/js/registry.js"
      - "site/js/shell.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/**"
  pull_request:
    paths:
      - ".github/scripts/verify-stack-facts.py"
      - ".github/workflows/stack-facts.yml"
      - "site/index.html"
      - "site/prework.html"
      - "site/checklists/prework-install.html"
      - "site/blocks/p3.html"
      - "site/blocks/hcp.html"
      - "site/blocks/p2.html"
      - "site/blocks/pi.html"
      - "site/blocks/p8.html"
      - "site/assets/blocks/pi/**"
      - "site/assets/course/course-progression.svg"
      - "site/assets/blocks/p3/**"
      - "site/js/registry.js"
      - "site/js/shell.js"
      - "instruments/**"
      - "mission_flesh/**"
      - "lead/**"
      - "operator/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stack-facts:
    name: verify-stack-facts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            instruments/p3_evidence_surface/package-lock.json
            instruments/osint_desk/package-lock.json
            mission_flesh/pi/package-lock.json

      - name: Test the Pi agentic-pattern implementations
        working-directory: mission_flesh/pi
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Run rotting-facts harness
        # Local checks are hard gates. Network drift probes use the same public
        # Node, npm, and AAIF channels named by the canonical install page.
        run: python .github/scripts/verify-stack-facts.py

      - name: Smoke-test the NORTHWIND evidence surface
        working-directory: instruments/p3_evidence_surface
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run smoke
          npm audit --omit=dev

      - name: Smoke-test the open source desk kit
        # Offline by design. The live feeds are probed as a soft drift check in
        # the rotting-facts harness; a public feed having a bad afternoon must
        # never turn this build red.
        working-directory: instruments/osint_desk
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run smoke
          npm audit --omit=dev
