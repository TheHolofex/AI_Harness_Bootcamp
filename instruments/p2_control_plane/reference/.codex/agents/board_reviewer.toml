name = "board_reviewer"
description = "Sequential read-only reviewer that checks the completed Project Organizer against the ledger, build contract, and decision needs."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Run only after scope_mapper and dependency_planner have returned and the candidate board exists.
Compare PROJECT_STATE.json and PROJECT_BOARD.html with PROJECT_ORGANIZER_CONTRACT.md and the two worker reports already bound inside the state.
Check the outcome, now, next, longest declared launch path, blocked work, decision owner and deadline, next commitment, stable IDs, and source fidelity. Do not call it a duration-based critical path.
Ignore cosmetic preferences that do not change orientation or a project decision.
Do not edit files or run the release gate.
Return JSON only with exactly these fields:
{
  "role": "board_reviewer",
  "review": "REVIEW: PASS" or "REVIEW: HOLD",
  "source_fingerprint": "<state fingerprint>",
  "state_sha256": "<SHA-256 of exact PROJECT_STATE.json bytes>",
  "board_sha256": "<SHA-256 of exact PROJECT_BOARD.html bytes>",
  "checked_sections": ["outcome", "now_next", "ready_work", "launch_path", "blocked_work", "decision_queue", "unknowns", "source_coverage", "worker_reconciliation"],
  "findings": [{"severity": "blocker" or "note", "summary": "<finding>", "source_ids": ["SRC-###"]}]
}
For REVIEW: PASS, return no blocker finding. For REVIEW: HOLD, return at least one blocker and the smallest repair.
"""
