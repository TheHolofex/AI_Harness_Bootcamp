<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p7-overview">
  <title id="title-p7-overview">P7 overview: rows in, AI classifies, checks run, exceptions hold at the human gate, only cleared rows reach the master sheet</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P7 · THE AUTOMATION LINE</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">01 BRIEF</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">02 ROWS</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">03 BUILD</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">04 GATE</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">05 EXCEPTIONS</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">06 SORT</text>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
  <text x="39" y="53" class="tiny red">START</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="82" class="micro red">ONE PASS · A DESIGNED PATH</text>
  <text x="24" y="111" class="title">Volume goes through the machine. Exceptions come to you.</text>
  <text x="24" y="132" class="purpose">Each row is read, classified by the AI step, checked by the flow, and only then written to the master sheet.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Five stations of the automation line">
    <rect x="24" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">01 · INTAKE</text>
    <text x="42" y="197" class="tiny muted">ROWS.CSV · ONE BY ONE</text>
    <path d="M214 186H240" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="244" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="262" y="182" class="micro muted">02 · AI STEP</text>
    <text x="262" y="197" class="tiny muted">CLASSIFY · EXTRACT</text>
    <path d="M434 186H460" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="464" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="482" y="182" class="micro muted">03 · VALIDATE</text>
    <text x="482" y="197" class="tiny muted">FIELDS · RANGES · PARSE</text>
    <path d="M654 186H680" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="684" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
    <text x="702" y="182" class="micro red">04 · HUMAN GATE</text>
    <text x="702" y="197" class="tiny muted">EXCEPTIONS HOLD HERE</text>
    <path d="M874 186H900" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="904" y="166" width="192" height="40" rx="2" fill="#0A0A0A"/>
    <text x="922" y="182" class="micro white">05 · MASTER SHEET</text>
    <text x="922" y="197" class="tiny white">ONLY CLEARED ROWS</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">NOT A HARNESS LOOP</text>
  <text x="68" y="260" class="caption">ONE PASS · NO MID-RUN CORRECTION</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">NOTHING LANDS SILENTLY</text>
  <text x="603" y="260" class="caption">BAD ROWS HOLD AT THE GATE, WITH REASONS</text>
</svg>
