<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p7-stage-build">
  <title id="title-p7-stage-build">Stage 03: wire the line — read rows, drop the answer column, AI step on a credential, checks route failures to the gate, cleared rows to the sheet</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P7 · THE AUTOMATION LINE</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">STAGE 03 OF 06</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
  <text x="113.5" y="40" class="railtext" text-anchor="middle">01 BRIEF</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="210" cy="37" r="2.6" fill="#E31C23"/>
  <text x="292.5" y="40" class="railtext" text-anchor="middle">02 ROWS</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#E31C23" stroke="#E31C23" stroke-width="1.4"/>
  <text x="468.5" y="40" class="railtext white" text-anchor="middle">03 BUILD</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">04 GATE</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">05 EXCEPTIONS</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">06 SORT</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">STAGE 03 · BUILD THE LINE</text>
  <text x="24" y="103" class="title">Wire the path node by node</text>
  <text x="24" y="123" class="purpose">Read rows in, classify with the AI step, check the output before it lands.</text>
  <text x="24" y="141" class="body muted">Checks live in the line: fields present, values allowed, unparseable holds.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
  <g aria-label="Node chain from read rows through AI step and checks to sheet or gate">
    <text x="678" y="90" class="tiny muted" text-anchor="middle">XAI KEY · N8N CREDENTIAL</text>
    <rect x="512" y="96" width="86" height="26" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="555" y="112" class="tiny muted" text-anchor="middle">READ ROWS</text>
    <path d="M598 109H626" class="line" marker-end="url(#arrow)"/>
    <rect x="630" y="96" width="96" height="26" rx="2" fill="#0A0A0A"/>
    <text x="678" y="112" class="tiny white" text-anchor="middle">AI STEP</text>
    <path d="M726 109H754" class="line" marker-end="url(#arrow)"/>
    <rect x="758" y="96" width="86" height="26" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.4"/>
    <text x="801" y="112" class="tiny red" text-anchor="middle">CHECKS</text>
    <path d="M844 109H900" class="line" marker-end="url(#arrow)"/>
    <text x="872" y="103" class="tiny muted" text-anchor="middle">PASS</text>
    <rect x="904" y="96" width="100" height="26" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="954" y="112" class="tiny muted" text-anchor="middle">MASTER SHEET</text>
    <path d="M801 122V138" class="redline" marker-end="url(#arrow-red)"/>
    <text x="822" y="134" class="tiny red">FAIL</text>
    <rect x="758" y="142" width="86" height="20" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.4"/>
    <text x="801" y="155" class="tiny red" text-anchor="middle">GATE · HELD</text>
    <text x="954" y="136" class="tiny muted" text-anchor="middle">CLEARED ROWS ONLY</text>
    <text x="512" y="158" class="tiny red">DROP EXPECTED_GATE BEFORE THE AI SEES IT</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS STAGE</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">TRIGGER + READ</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">DROP ANSWER COL</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">AI CREDENTIAL</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">PROMPT THE STEP</text>
  <rect x="744" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.5" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="778" y="198.2" class="caption">PARSE + CHECK</text>
  <rect x="924" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.5" y="198.3" class="caption white" text-anchor="middle">06</text>
  <text x="958" y="198.2" class="caption">WRITE THE SINK</text>
</svg>
