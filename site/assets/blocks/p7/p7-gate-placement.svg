<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p7-gate-placement">
  <title id="title-p7-gate-placement">Concept: a gate before the sheet catches bad rows; a gate after the sheet approves rows that already landed</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P7 · THE AUTOMATION LINE</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">01 BRIEF</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">02 ROWS</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">03 BUILD</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">04 GATE</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">05 EXCEPTIONS</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">06 SORT</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">CONCEPT · THE HUMAN GATE</text>
  <text x="24" y="103" class="title">Where the gate sits is the design</text>
  <text x="24" y="123" class="purpose">Before the sheet you are a quality check; after it you approve what landed.</text>
  <text x="24" y="141" class="body muted">A held row must arrive with its reason, or the gate trains you to click yes.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Gate upstream of the sheet versus gate downstream">
    <text x="512" y="92" class="tiny red">A · GATE BEFORE THE WRITE — YOU ARE A QUALITY CHECK</text>
    <rect x="512" y="98" width="56" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="540" y="111" class="tiny muted" text-anchor="middle">AI</text>
    <path d="M568 108H584" class="line" marker-end="url(#arrow)"/>
    <rect x="588" y="98" width="64" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="620" y="111" class="tiny muted" text-anchor="middle">CHECKS</text>
    <path d="M652 108H668" class="line" marker-end="url(#arrow)"/>
    <rect x="672" y="98" width="56" height="20" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.4"/>
    <text x="700" y="111" class="tiny red" text-anchor="middle">GATE</text>
    <path d="M728 108H744" class="line" marker-end="url(#arrow)"/>
    <rect x="748" y="98" width="64" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="780" y="111" class="tiny muted" text-anchor="middle">SHEET</text>
    <circle cx="700" cy="98" r="2.8" fill="#E31C23"/>
    <text x="840" y="111" class="tiny red">BAD ROW HOLDS · SHEET STAYS CLEAN</text>
    <path d="M512 126H1096" class="hair"/>
    <text x="512" y="136" class="tiny muted">B · GATE AFTER THE WRITE — YOU ARE A RUBBER STAMP</text>
    <rect x="512" y="141" width="56" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="540" y="154" class="tiny muted" text-anchor="middle">AI</text>
    <path d="M568 151H584" class="line" marker-end="url(#arrow)"/>
    <rect x="588" y="141" width="64" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="620" y="154" class="tiny muted" text-anchor="middle">SHEET</text>
    <path d="M652 151H668" class="line" marker-end="url(#arrow)"/>
    <rect x="672" y="141" width="56" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="700" y="154" class="tiny muted" text-anchor="middle">GATE</text>
    <circle cx="620" cy="141" r="2.8" fill="#E31C23"/>
    <text x="840" y="154" class="tiny muted">BAD ROW ALREADY LANDED · APPROVAL IS THEATER</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS IDEA</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">GATE = A PAUSE</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">BEFORE = CATCH</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">AFTER = THEATER</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">REASON ATTACHED</text>
  <rect x="744" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.5" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="778" y="198.2" class="caption">HOLD, NOT FAIL</text>
  <rect x="924" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.5" y="198.3" class="caption white" text-anchor="middle">06</text>
  <text x="958" y="198.2" class="caption">TUNE THE RATE</text>
</svg>
