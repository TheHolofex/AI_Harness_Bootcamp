  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">STAGE 08 · SEAL</text>
  <text x="24" y="103" class="title">The evidence seals the file</text>
  <text x="24" y="123" class="purpose">The defense's four chips feed the 30-60-90 — sealed live, adversarially, dated.</text>
  <text x="24" y="141" class="body muted">SEALED with a date — a living file, not a Friday dump.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
  <g aria-label="Defense evidence feeding the sealed transfer file">
    <rect x="512" y="80" width="300" height="72" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="524" y="94" class="micro muted">90-SECOND DEFENSE · EVIDENCE ONLY</text>
    <rect x="524" y="102" width="130" height="20" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="589" y="115.5" class="tiny" text-anchor="middle">MATRIX TOTALS</text>
    <rect x="668" y="102" width="130" height="20" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="733" y="115.5" class="tiny" text-anchor="middle">POLICY VERSION</text>
    <rect x="524" y="126" width="130" height="20" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="589" y="139.5" class="tiny" text-anchor="middle">ONE ACCEPT</text>
    <rect x="668" y="126" width="130" height="20" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="733" y="139.5" class="tiny" text-anchor="middle">ONE REJECT</text>
