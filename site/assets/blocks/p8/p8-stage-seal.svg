    <rect x="866" y="80" width="214" height="72" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
    <circle cx="890" cy="102" r="9" fill="#E31C23"/>
    <path d="M886 102l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <text x="908" y="98" class="micro red">TRANSFER 30-60-90</text>
    <text x="908" y="114" class="caption">SEALED · DATED</text>
    <text x="878" y="140" class="tiny muted">SESSION LOG SHOWS THE WHOLE WEEK</text>
  </g>
