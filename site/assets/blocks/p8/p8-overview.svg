<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p8-overview">
  <title id="title-p8-overview">P8 overview: policy first, re-point, cold run, matrix and refuse, defend and seal</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P8 · OPERATOR-GOVERNED OPEN MODEL</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M88 37H1026" class="hair"/>
  <rect x="24" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="88" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="158" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="222" y="40" class="railtext muted" text-anchor="middle">2 Policy</text>
  <rect x="292" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="356" y="40" class="railtext muted" text-anchor="middle">3 Re-point</text>
  <rect x="426" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="490" y="40" class="railtext muted" text-anchor="middle">4 Cold run</text>
  <rect x="560" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="624" y="40" class="railtext muted" text-anchor="middle">5 Matrix</text>
  <rect x="694" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="758" y="40" class="railtext muted" text-anchor="middle">6 Refuse</text>
  <rect x="828" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="892" y="40" class="railtext muted" text-anchor="middle">7 Defend</text>
  <rect x="962" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1026" y="40" class="railtext muted" text-anchor="middle">8 Seal</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">FRIDAY AM · THE METHOD MOVES OR IT WAS RENTED</text>
  <text x="24" y="111" class="title">Prove the method survives the vendor.</text>
  <text x="24" y="132" class="purpose">Policy first, then re-point, re-run the frozen suite, read the tax as counts, and seal.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Five phases of the block">
    <rect x="24" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">01 · POLICY FIRST</text>
    <text x="42" y="197" class="tiny muted">AUP BEFORE TOUCH</text>
    <path d="M214 186H236" class="line" marker-end="url(#arrow)"/>
    <rect x="246" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="264" y="182" class="micro muted">02 · RE-POINT</text>
    <text x="264" y="197" class="tiny muted">ENDPOINT + MODEL PINNED</text>
    <path d="M436 186H458" class="line" marker-end="url(#arrow)"/>
    <rect x="468" y="166" width="180" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="486" y="182" class="micro muted">03 · COLD RUN</text>
    <text x="486" y="197" class="tiny muted">D01–D05 · UNEDITED</text>
    <path d="M648 186H670" class="line" marker-end="url(#arrow)"/>
    <rect x="680" y="166" width="210" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="698" y="182" class="micro muted">04 · MATRIX + REFUSE</text>
    <text x="698" y="197" class="tiny muted">HOLD · DEGRADE · IMPROVE</text>
    <path d="M890 186H912" class="line" marker-end="url(#arrow)"/>
    <rect x="922" y="166" width="174" height="40" rx="2" fill="#0A0A0A"/>
    <text x="940" y="182" class="micro white">05 · DEFEND + SEAL</text>
    <text x="940" y="197" class="tiny white">90S · 30-60-90 SEALED</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">SAME SUITE AS TUESDAY</text>
  <text x="68" y="260" class="caption">D01–D05 · YOUR TRACK · NO EDITS</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">CLOSED = NUMBERS + POLICY + SEAL</text>
  <text x="603" y="260" class="caption">MATRIX · REFUSE ON RECORD · TRANSFER SEALED</text>
</svg>
