<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p8-concept-hold-degrade">
  <title id="title-p8-concept-hold-degrade">Concept: hold, degrade, improve — one frozen suite scored on two endpoints, read as counts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P8 · OPERATOR-GOVERNED OPEN MODEL</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M88 37H1026" class="hair"/>
  <rect x="24" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="88" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="158" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="222" y="40" class="railtext muted" text-anchor="middle">2 Policy</text>
  <rect x="292" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="356" y="40" class="railtext muted" text-anchor="middle">3 Re-point</text>
  <rect x="426" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="490" y="40" class="railtext muted" text-anchor="middle">4 Cold run</text>
  <rect x="560" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="624" y="40" class="railtext muted" text-anchor="middle">5 Matrix</text>
  <rect x="694" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="758" y="40" class="railtext muted" text-anchor="middle">6 Refuse</text>
  <rect x="828" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="892" y="40" class="railtext muted" text-anchor="middle">7 Defend</text>
  <rect x="962" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1026" y="40" class="railtext muted" text-anchor="middle">8 Seal</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">CONCEPT · CAPABILITY TAX</text>
  <text x="24" y="103" class="title">Hold, degrade, improve</text>
  <text x="24" y="123" class="purpose">One frozen suite, two endpoints — the difference is a count, not a feeling.</text>
  <text x="24" y="141" class="body muted">Hold = PASS on both · Degrade = home PASS, open FAIL · Improve = the reverse.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Three outcome lanes and a totals card">
    <rect x="512" y="84" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="566" y="97" class="tiny" text-anchor="middle">HOME PASS</text>
    <path d="M622 94H648" class="line" marker-end="url(#arrow)"/>
    <rect x="652" y="84" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="706" y="97" class="tiny" text-anchor="middle">OPEN PASS</text>
    <text x="790" y="98" class="caption">HOLD · SAME PASS BOTH</text>
    <rect x="512" y="108" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="566" y="121" class="tiny" text-anchor="middle">HOME PASS</text>
    <path d="M622 118H648" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="652" y="108" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
    <text x="706" y="121" class="tiny red" text-anchor="middle">OPEN FAIL</text>
    <text x="790" y="122" class="caption red">DEGRADE · THE TAX</text>
    <rect x="512" y="132" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="566" y="145" class="tiny muted" text-anchor="middle">HOME FAIL</text>
    <path d="M622 142H648" class="line" marker-end="url(#arrow)"/>
    <rect x="652" y="132" width="108" height="20" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="706" y="145" class="tiny" text-anchor="middle">OPEN PASS</text>
    <text x="790" y="146" class="caption">IMPROVE · RARE, READ IT</text>
    <rect x="952" y="84" width="128" height="68" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="1016" y="98" class="micro muted" text-anchor="middle">TOTALS</text>
    <text x="1016" y="116" class="caption" text-anchor="middle">OPEN n/5</text>
    <text x="1016" y="132" class="caption" text-anchor="middle">HOME n/5</text>
    <text x="1016" y="147" class="tiny muted" text-anchor="middle">COUNTS, NOT VIBES</text>
    <text x="512" y="162" class="tiny muted">SAME D01–D05 FILES, UNEDITED — OR THE COMPARISON MEANS NOTHING</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN PRACTICE</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">SAME CASE IDS</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">SCORE P/F</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">COUNT HOLDS</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">COUNT DEGRADES</text>
  <rect x="744" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.5" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="778" y="198.2" class="caption">NAME THE TAX</text>
  <rect x="924" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.5" y="198.3" class="caption white" text-anchor="middle">06</text>
  <text x="958" y="198.2" class="caption">COUNT IMPROVES</text>
</svg>
