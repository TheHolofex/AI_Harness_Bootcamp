<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p8-stage-refuse">
  <title id="title-p8-stage-refuse">Stage 6: a legitimate task refused by your own policy, beside an allowed control task that runs — both recorded</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P8 · OPERATOR-GOVERNED OPEN MODEL</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">STAGE 06 OF 08</text>
  <path d="M88 37H1026" class="hair"/>
  <rect x="24" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
  <text x="91" y="40" class="railtext" text-anchor="middle">1 Brief</text>
  <rect x="158" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="165" cy="37" r="2.6" fill="#E31C23"/>
  <text x="225" y="40" class="railtext" text-anchor="middle">2 Policy</text>
  <rect x="292" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="299" cy="37" r="2.6" fill="#E31C23"/>
  <text x="359" y="40" class="railtext" text-anchor="middle">3 Re-point</text>
  <rect x="426" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="433" cy="37" r="2.6" fill="#E31C23"/>
  <text x="493" y="40" class="railtext" text-anchor="middle">4 Cold run</text>
  <rect x="560" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="567" cy="37" r="2.6" fill="#E31C23"/>
  <text x="627" y="40" class="railtext" text-anchor="middle">5 Matrix</text>
  <rect x="694" y="25" width="128" height="24" rx="2" fill="#E31C23" stroke="#E31C23" stroke-width="1.4"/>
  <text x="758" y="40" class="railtext white" text-anchor="middle">6 Refuse</text>
  <rect x="828" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="892" y="40" class="railtext muted" text-anchor="middle">7 Defend</text>
  <rect x="962" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1026" y="40" class="railtext muted" text-anchor="middle">8 Seal</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">STAGE 06 · REFUSE UNDER YOUR POLICY</text>
  <text x="24" y="103" class="title">Run the refusal on purpose</text>
  <text x="24" y="123" class="purpose">One legitimate task your policy forbids, one allowed control — both on the record.</text>
  <text x="24" y="141" class="body muted">A policy that never costs anything governs nothing.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
  <g aria-label="Two tasks meeting the AUP gate with opposite outcomes">
    <rect x="512" y="82" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="597" y="100" class="caption" text-anchor="middle">LEGITIMATE TASK</text>
    <rect x="512" y="124" width="170" height="28" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="597" y="142" class="caption" text-anchor="middle">CONTROL TASK</text>
    <path d="M682 96H706" class="line" marker-end="url(#arrow)"/>
    <path d="M682 138H706" class="line" marker-end="url(#arrow)"/>
    <rect x="706" y="74" width="72" height="86" rx="2" fill="#FAFAF8" stroke="#1A1A1A"/>
    <text x="742" y="112" class="caption" text-anchor="middle">AUP</text>
    <text x="742" y="126" class="tiny muted" text-anchor="middle">V1 · DATED</text>
    <path d="M778 96H806" class="redline" marker-end="url(#arrow-red)"/>
    <path d="M778 138H806" class="line" marker-end="url(#arrow)"/>
    <rect x="816" y="82" width="264" height="28" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
    <text x="948" y="100" class="caption red" text-anchor="middle">REFUSED · REASON ON RECORD</text>
    <rect x="816" y="124" width="264" height="28" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="948" y="142" class="caption" text-anchor="middle">RUNS · OUTPUT ON RECORD</text>
    <text x="512" y="162" class="tiny muted">BOTH GO IN THE LOG — THE CONTRAST IS THE EVIDENCE</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS STAGE</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">PICK REAL TASK</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">CHECK POLICY</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">REFUSE + REASON</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">RUN CONTROL</text>
  <rect x="744" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.5" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="778" y="198.2" class="caption">RECORD BOTH</text>
  <rect x="924" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.5" y="198.3" class="caption white" text-anchor="middle">06</text>
  <text x="958" y="198.2" class="caption">NO EXCEPTIONS</text>
</svg>
