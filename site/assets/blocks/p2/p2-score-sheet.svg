<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p2-score-sheet">
  <title id="title-p2-score-sheet">Stage 02: baseline run — score cases D01 to D05 strictly and record the total to beat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P2 · THE MEASURED HARNESS</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">STAGE 02 OF 06</text>
  <path d="M53 37H1005" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
  <text x="110" y="40" class="railtext" text-anchor="middle">1 Brief</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#E31C23" stroke="#E31C23" stroke-width="1.4"/>
  <text x="289" y="40" class="railtext white" text-anchor="middle">2 Baseline</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468" y="40" class="railtext muted" text-anchor="middle">3 Improve</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647" y="40" class="railtext muted" text-anchor="middle">4 Rescore</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826" y="40" class="railtext muted" text-anchor="middle">5 Cold proof</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005" y="40" class="railtext muted" text-anchor="middle">6 Seed</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">STAGE 02 · AS IT SHIPS</text>
  <text x="24" y="103" class="title">Baseline the unchanged harness</text>
  <text x="24" y="123" class="purpose">Run D01–D05 in five isolated chats; score each strictly against its pass-if line.</text>
  <text x="24" y="141" class="body muted">Expect fails — a clean 5/5 baseline usually means soft grading.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
  <g aria-label="Score sheet baseline column with five cases and a total">
    <text x="548" y="90" class="tiny muted">SCORE_SHEET.MD · BASELINE COLUMN</text>
    <rect x="548" y="96" width="64" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="580" y="112" class="caption" text-anchor="middle">D01</text>
    <text x="580" y="126" class="tiny" text-anchor="middle">PASS</text>
    <rect x="620" y="96" width="64" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="652" y="112" class="caption" text-anchor="middle">D02</text>
    <text x="652" y="126" class="tiny red" text-anchor="middle">FAIL</text>
    <rect x="692" y="96" width="64" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="724" y="112" class="caption" text-anchor="middle">D03</text>
    <text x="724" y="126" class="tiny" text-anchor="middle">PASS</text>
    <rect x="764" y="96" width="64" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="796" y="112" class="caption" text-anchor="middle">D04</text>
    <text x="796" y="126" class="tiny red" text-anchor="middle">FAIL</text>
    <rect x="836" y="96" width="64" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="868" y="112" class="caption" text-anchor="middle">D05</text>
    <text x="868" y="126" class="tiny red" text-anchor="middle">FAIL</text>
    <path d="M900 115H924" class="line" marker-end="url(#arrow)"/>
    <rect x="930" y="96" width="136" height="38" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="998" y="112" class="micro muted" text-anchor="middle">BASELINE</text>
    <text x="998" y="127" class="caption" text-anchor="middle">2 / 5</text>
    <path d="M930 142H1066" class="redline"/>
    <text x="998" y="152" class="tiny red" text-anchor="middle">BEAT THIS NUMBER</text>
    <text x="548" y="152" class="tiny muted">EVERY FAIL NOTE IS A WORK ORDER FOR STAGE 03</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS STAGE</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">ONE CHAT / CASE</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">RUN D01–D05</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">SCORE STRICT</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">NOTE EACH FAIL</text>
</svg>
