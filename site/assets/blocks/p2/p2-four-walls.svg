  <text x="24" y="76" class="micro red">CONCEPT · THE FOUR WALLS</text>
  <text x="24" y="103" class="title">Four walls around one loop</text>
  <text x="24" y="123" class="purpose">Loop quality tracks the walls you build, not model magic.</text>
  <text x="24" y="141" class="body muted">Instructions, tests, memory, skills — each one a real artifact, not a habit.</text>
