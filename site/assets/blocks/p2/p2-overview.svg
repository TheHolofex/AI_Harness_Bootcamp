<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p2-overview">
  <title id="title-p2-overview">P2 hot-rod morning overview: baseline, move the walls, re-measure, prove it cold, claim and seed</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P2 · THE HOT-ROD MORNING</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M53 37H1005" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289" y="40" class="railtext muted" text-anchor="middle">2 Baseline</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468" y="40" class="railtext muted" text-anchor="middle">3 Hot-rod</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647" y="40" class="railtext muted" text-anchor="middle">4 Rescore</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826" y="40" class="railtext muted" text-anchor="middle">5 Cold proof</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005" y="40" class="railtext muted" text-anchor="middle">6 Seed</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">TUESDAY AM · MEASURED HARNESS CRAFT</text>
  <text x="24" y="111" class="title">Measure. Move a wall. Measure.</text>
  <text x="24" y="132" class="purpose">Baseline the stock harness on five fixed cases, then prove your craft moved the number.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Five phases of the morning">
    <rect x="24" y="166" width="188" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">STOCK REVEAL</text>
    <text x="42" y="197" class="tiny muted">BASELINE D01–D05</text>
    <path d="M212 186H234" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="244" y="166" width="188" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="262" y="182" class="micro muted">MOVE WALLS</text>
    <text x="262" y="197" class="tiny muted">TWO LAYERS · ONE AT A TIME</text>
    <path d="M432 186H454" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="464" y="166" width="188" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="482" y="182" class="micro muted">RE-MEASURE</text>
    <text x="482" y="197" class="tiny muted">COLD RESCORE · DELTA</text>
    <path d="M652 186H674" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="684" y="166" width="188" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="702" y="182" class="micro muted">PROVE IT COLD</text>
    <text x="702" y="197" class="tiny muted">RESTART · RE-RUN A CASE</text>
    <path d="M872 186H894" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="904" y="166" width="192" height="40" rx="2" fill="#0A0A0A"/>
    <text x="922" y="182" class="micro white">CLAIM + SEED</text>
    <text x="922" y="197" class="tiny white">WHICH WALL MOVED · 30-DAY</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">THE INSTRUMENT</text>
  <text x="68" y="260" class="caption">INSTRUMENTS/P2_DYNO · SCORE_SHEET.MD</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">DEEP MARK</text>
  <text x="603" y="260" class="caption">DYNO: BASELINE n/5 → AFTER n/5</text>
</svg>
