    <text x="774" y="85" class="caption" text-anchor="middle">CORRECTNESS</text>
    <rect x="694" y="102" width="160" height="24" rx="2" fill="#FFFFFF" stroke="#A58650" stroke-width="1.35"/>
    <text x="774" y="117" class="caption" text-anchor="middle">TEST GAPS</text>
    <rect x="694" y="134" width="160" height="24" rx="2" fill="#FFFFFF" stroke="#A58650" stroke-width="1.35"/>
    <text x="774" y="149" class="caption" text-anchor="middle">SPEC DRIFT</text>
