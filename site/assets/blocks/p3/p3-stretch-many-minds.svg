    <path d="M854 114H878" class="hair"/>
    <path d="M854 146H878" class="hair"/>
    <path d="M878 82V146" class="line"/>
    <path d="M878 114H902" class="line" marker-end="url(#arrow)"/>
    <rect x="910" y="84" width="166" height="28" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="993" y="101" class="caption" text-anchor="middle">SYNTHESIS + KILLS</text>
    <path d="M993 112V120" class="line" marker-end="url(#arrow)"/>
    <rect x="910" y="126" width="166" height="28" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="993" y="143" class="caption" text-anchor="middle">DELTA VS BASELINE</text>
    <text x="512" y="158" class="tiny muted">WAIT FOR ALL THREE · MERGE ON DISK</text>
