  <circle cx="747" cy="37" r="2.6" fill="#E31C23"/>
  <text x="829.5" y="40" class="railtext" text-anchor="middle">5 Adjudicate</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="926" cy="37" r="2.6" fill="#E31C23"/>
  <text x="1008.5" y="40" class="railtext" text-anchor="middle">6 Close</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro gold">STRETCH · MANY MINDS, ONE COMMANDER</text>
  <text x="24" y="103" class="title">One commander, three lenses</text>
  <text x="24" y="123" class="purpose">Baseline first, then parallel specialists; you own merges and kills.</text>
  <text x="24" y="139" class="body muted">Subagent, second engine, second human — three different instruments.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Commander dispatches three subagent lenses, waits for all, then writes synthesis and delta">
    <rect x="512" y="92" width="132" height="40" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="578" y="108" class="caption" text-anchor="middle">COMMANDER</text>
