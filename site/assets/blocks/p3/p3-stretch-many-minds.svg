  <text x="1096" y="13" class="micro gold" text-anchor="end">STRETCH · AFTER STAGE 06</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
