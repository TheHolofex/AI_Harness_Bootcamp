  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="210" cy="37" r="2.6" fill="#E31C23"/>
  <text x="292.5" y="40" class="railtext" text-anchor="middle">2 Load brief</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="389" cy="37" r="2.6" fill="#E31C23"/>
  <text x="471.5" y="40" class="railtext" text-anchor="middle">3 Dispatch</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <circle cx="568" cy="37" r="2.6" fill="#E31C23"/>
