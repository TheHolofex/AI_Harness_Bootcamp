<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p3-idea-hidden-cargo">
  <title id="title-p3-idea-hidden-cargo">Hidden cargo: what each engine silently loads, and the declare-or-clear gate before a delta counts as evidence</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P3 · TWIN-ENGINE INTEL DESK</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">1 Frame</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">2 Load brief</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">3 Dispatch</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">4 Compare</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Adjudicate</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Close</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">CONCEPT · INDEPENDENCE HYGIENE</text>
  <text x="24" y="103" class="title">The cargo neither engine declares</text>
  <text x="24" y="123" class="purpose">Both engines load context you never typed this session.</text>
  <text x="24" y="139" class="body muted">Declare it or clear it before any delta counts as evidence.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Two engines carrying undeclared context into a declare-or-clear gate">
    <rect x="512" y="84" width="236" height="30" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="524" y="96" class="micro">CODEX APP</text>
    <text x="524" y="108" class="tiny muted">AGENTS.MD · SKILLS · MEMORIES</text>
    <rect x="512" y="120" width="236" height="30" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="524" y="132" class="micro">OPENCODE</text>
    <text x="524" y="144" class="tiny muted">CLAUDE.MD · .CLAUDE/SKILLS</text>
    <path d="M748 99H796" class="line" marker-end="url(#arrow)"/>
    <path d="M748 135H796" class="line" marker-end="url(#arrow)"/>
    <rect x="800" y="88" width="140" height="56" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
    <text x="870" y="112" class="micro red" text-anchor="middle">DECLARE</text>
    <text x="870" y="126" class="micro red" text-anchor="middle">OR CLEAR</text>
    <path d="M940 116H978" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="986" y="100" width="110" height="32" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="1041" y="113" class="caption" text-anchor="middle">DELTA</text>
    <text x="1041" y="126" class="caption" text-anchor="middle">COUNTS</text>
    <text x="512" y="160" class="tiny muted">CLEAR = CLEAN FOLDER · OPENCODE_DISABLE_CLAUDE_CODE=1 · --PURE</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">THE MOVES</text>
  <rect x="24.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.50" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58.00" y="198.2" class="caption">NAME THE CARGO</text>
  <rect x="204.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.50" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238.00" y="198.2" class="caption">CLEAN FOLDER</text>
  <rect x="384.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.50" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418.00" y="198.2" class="caption">DISABLE FLAG SET</text>
  <rect x="564.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.50" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598.00" y="198.2" class="caption">PIN THE MODEL</text>
  <rect x="744.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.50" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="778.00" y="198.2" class="caption">DECLARE IT</text>
  <rect x="924.00" y="182" width="172.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.50" y="198.3" class="caption white" text-anchor="middle">06</text>
  <text x="958.00" y="198.2" class="caption">THEN COMPARE</text>
</svg>
