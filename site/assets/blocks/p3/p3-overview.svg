<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p3-overview">
  <title id="title-p3-overview">P3 twin-engine desk overview: frozen sources, deterministic join, one brief on two engines, comparator, your verdict</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P3 · TWIN-ENGINE INTEL DESK</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">1 Frame</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">2 Load brief</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">3 Dispatch</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">4 Compare</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Adjudicate</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Close</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">TUESDAY PM · ONE BRIEF, TWO ENGINES</text>
  <text x="24" y="111" class="title">Two engines, one verdict — yours.</text>
  <text x="24" y="132" class="purpose">Freeze the brief and sources, run both engines, spend judgment only where outputs split.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Five phases from frozen sources to your verdict">
    <rect x="24" y="166" width="182" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">01 · FROZEN SOURCES</text>
    <text x="42" y="197" class="tiny muted">WATCHLIST.CSV + F1–F3</text>
    <path d="M206 186H228" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="238" y="166" width="186" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="256" y="182" class="micro muted">02 · WATCHLIST JOIN</text>
    <text x="256" y="197" class="tiny muted">IDS FROM THE CSV ONLY</text>
    <path d="M424 186H446" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="456" y="166" width="226" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="474" y="182" class="micro muted">03 · TWO ENGINES</text>
    <text x="474" y="197" class="tiny muted">SAME BRIEF-V1 · CODEX + OPENCODE</text>
    <path d="M682 186H704" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="714" y="166" width="160" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="732" y="182" class="micro muted">04 · COMPARATOR</text>
    <text x="732" y="197" class="tiny muted">SIDE BY SIDE, ON DISK</text>
    <path d="M874 186H896" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="906" y="166" width="190" height="40" rx="2" fill="#0A0A0A"/>
    <text x="924" y="182" class="micro white">05 · YOUR VERDICT</text>
    <text x="924" y="197" class="tiny white">KEEP · DISCARD · UNKNOWN</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">AGREEMENT IS NOT TRUTH</text>
  <text x="68" y="260" class="caption">TWO ENGINES CAN SHARE A BLIND SPOT</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">DISAGREEMENT IS A SENSOR</text>
  <text x="603" y="260" class="caption">IT POINTS WHERE YOUR JUDGMENT IS NEEDED MOST</text>
</svg>
