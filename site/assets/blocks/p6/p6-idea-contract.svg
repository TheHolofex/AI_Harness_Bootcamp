<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p6-idea-contract">
  <title id="title-p6-idea-contract">The two-column autonomy contract: tool-enforced bounds name a real goose lever; procedure-enforced bounds are promises you keep</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P6 · THE WATCH OFFICER</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M88 37H1026" class="hair"/>
  <rect x="24" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="88" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="158" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="222" y="40" class="railtext muted" text-anchor="middle">2 Pack</text>
  <rect x="292" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="356" y="40" class="railtext muted" text-anchor="middle">3 First run</text>
  <rect x="426" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="490" y="40" class="railtext muted" text-anchor="middle">4 Contract</text>
  <rect x="560" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="624" y="40" class="railtext muted" text-anchor="middle">5 Stop/restart</text>
  <rect x="694" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="758" y="40" class="railtext muted" text-anchor="middle">6 Exception</text>
  <rect x="828" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="892" y="40" class="railtext muted" text-anchor="middle">7 Unattended</text>
  <rect x="962" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1026" y="40" class="railtext muted" text-anchor="middle">8 Min harness</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">IDEA · THE TWO-COLUMN CONTRACT</text>
  <text x="24" y="103" class="title">Every bound lives in a column</text>
  <text x="24" y="123" class="purpose">A lever the harness holds, or a promise you keep — never confuse the two.</text>
  <text x="24" y="141" class="body muted">Map every serious feeder risk to a column; an unmapped risk is an orphan.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Two contract columns: tool-enforced and procedure-enforced">
    <rect x="512" y="84" width="280" height="66" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="524" y="98" class="micro muted">TOOL-ENFORCED · THE HARNESS HOLDS IT</text>
    <text x="524" y="114" class="body">extensions: developer only</text>
    <text x="524" y="128" class="body">settings.max_turns: 12 · retry check</text>
    <text x="524" y="142" class="body">GOOSE_MODE=approve</text>
    <rect x="808" y="84" width="288" height="66" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="820" y="98" class="micro muted">PROCEDURE-ENFORCED · YOU HOLD IT</text>
    <text x="820" y="114" class="body">feeder is data · you review quarantines</text>
    <text x="820" y="128" class="body">who may stop · who may restart</text>
    <text x="820" y="142" class="body">review window before re-enable</text>
    <text x="804" y="160" class="tiny red" text-anchor="middle">A TOOL ROW NAMES A LEVER — “BE SAFE” PROSE BELONGS IN YOUR COLUMN</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS IDEA</text>
