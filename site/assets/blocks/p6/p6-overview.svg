<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p6-overview">
  <title id="title-p6-overview">P6 The watch officer — whole-block overview: feeder traffic runs under your contract, exceptions surface to you, you hold the stop</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P6 · THE WATCH OFFICER</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M88 37H1026" class="hair"/>
  <rect x="24" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="88" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="158" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="222" y="40" class="railtext muted" text-anchor="middle">2 Pack</text>
  <rect x="292" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="356" y="40" class="railtext muted" text-anchor="middle">3 First run</text>
  <rect x="426" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="490" y="40" class="railtext muted" text-anchor="middle">4 Contract</text>
  <rect x="560" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="624" y="40" class="railtext muted" text-anchor="middle">5 Stop/restart</text>
  <rect x="694" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="758" y="40" class="railtext muted" text-anchor="middle">6 Exception</text>
  <rect x="828" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="892" y="40" class="railtext muted" text-anchor="middle">7 Unattended</text>
  <rect x="962" y="25" width="128" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1026" y="40" class="railtext muted" text-anchor="middle">8 Min harness</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">THURSDAY AM · AUTONOMY UNDER CONTRACT</text>
  <text x="24" y="111" class="title">Work continues. You hold the stop.</text>
  <text x="24" y="132" class="purpose">A goose recipe works the feeder under bounds you wrote; exceptions come to you.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Watch flow from feeder to summary with exceptions surfacing to the operator">
    <rect x="24" y="166" width="140" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">FEEDER/</text>
    <text x="42" y="197" class="tiny muted">TRAFFIC DROPS IN</text>
    <path d="M164 186H186" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="196" y="166" width="230" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="214" y="182" class="micro muted">WATCH OFFICER RECIPE</text>
    <text x="214" y="197" class="tiny muted">RUNS UNDER YOUR CONTRACT</text>
    <path d="M426 186H448" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="458" y="166" width="200" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="476" y="182" class="micro muted">OUT/WATCH_SUMMARY.MD</text>
    <text x="476" y="197" class="tiny muted">APPEND · ONE LINE PER FILE</text>
    <path d="M658 186H680" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="690" y="166" width="190" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="708" y="182" class="micro muted">EXCEPTIONS SURFACE</text>
    <text x="708" y="197" class="tiny muted">QUARANTINE · HELD FOR YOU</text>
    <path d="M880 186H902" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="912" y="166" width="184" height="40" rx="2" fill="#0A0A0A"/>
    <text x="930" y="182" class="micro white">YOU HOLD THE STOP</text>
    <text x="930" y="197" class="tiny white">CTRL+C · RESTART CLEAN</text>
  </g>
  <rect x="0" y="224" width="1120" height="56" fill="#FAFAF8"/>
  <rect x="24" y="236" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="254" r="7" fill="#0A0A0A"/>
  <text x="68" y="251" class="micro muted">TOOL-ENFORCED · LEVERS GOOSE HOLDS</text>
  <text x="68" y="264" class="caption">EXTENSIONS · MODE · MAX TURNS · RETRY · SCHEDULE</text>
  <rect x="557" y="236" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="254" r="7" fill="#E31C23"/>
  <path d="M577 254l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="251" class="micro red">PROCEDURE-ENFORCED · PROMISES YOU KEEP</text>
  <text x="603" y="264" class="caption">FEEDER IS DATA · YOU REVIEW QUARANTINES · WHO RESTARTS</text>
</svg>
