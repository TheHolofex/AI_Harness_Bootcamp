  <text x="24" y="76" class="micro gold">STRETCH · THE ENDPOINT IS A WALL</text>
  <text x="24" y="103" class="title">Same recipe, different brain</text>
  <text x="24" y="123" class="purpose">Hold the mission still, swap the endpoint, measure what degrades.</text>
  <text x="24" y="141" class="body muted">Guide: mission_flesh/p6/local_endpoint_notes.md · staff-pinned model only.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
