  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Brief note</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Transfer</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">STAGE 04 · TRAIL AUDIT</text>
  <text x="24" y="103" class="title">Walk every trail, kill what fails</text>
  <text x="24" y="123" class="purpose">Open each cited note, mark a verdict in writing, then fix the claims that fail.</text>
  <text x="24" y="142" class="body muted">Partial counts as failed when the answer stated the claim as fact.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
