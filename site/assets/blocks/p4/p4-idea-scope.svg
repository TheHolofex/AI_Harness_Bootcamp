<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p4-idea-scope">
  <title id="title-p4-idea-scope">Concept: the scope boundary — what the assistant can reach and what stays outside</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P4 · THE DIRECTOR&#8217;S SECOND BRAIN</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">1 Scope</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">2 Triage</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">3 Questions</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">4 Audit</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Brief note</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Transfer</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">IDEA · SCOPED ACCESS</text>
  <text x="24" y="103" class="title">Reach you can audit</text>
  <text x="24" y="123" class="purpose">The project folder sets what the assistant can see; your brief writes what it may do.</text>
  <text x="24" y="142" class="body muted">Enough access to be useful &#8212; no more than you can audit.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="Project boundary with vault files inside and unreachable files outside">
    <rect x="512" y="84" width="330" height="60" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="524" y="96" class="micro muted">THE PROJECT &#8212; WHAT IT CAN REACH</text>
    <rect x="524" y="102" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="572" y="112" class="tiny" text-anchor="middle">MOC</text>
    <rect x="628" y="102" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="676" y="112" class="tiny" text-anchor="middle">00_INBOX</text>
    <rect x="732" y="102" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="780" y="112" class="tiny" text-anchor="middle">PEOPLE</text>
    <rect x="524" y="122" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="572" y="132" class="tiny" text-anchor="middle">SYSTEMS</text>
    <rect x="628" y="122" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="676" y="132" class="tiny" text-anchor="middle">EVENTS</text>
    <rect x="732" y="122" width="96" height="14" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="780" y="132" class="tiny" text-anchor="middle">DECISIONS</text>
    <text x="864" y="117" class="tiny muted">NO PATH</text>
    <rect x="906" y="84" width="190" height="60" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-dasharray="5 4"/>
    <text x="918" y="96" class="micro muted">OUTSIDE &#8212; NOT REACHED</text>
    <rect x="918" y="102" width="166" height="11" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="1001" y="110" class="tiny muted" text-anchor="middle">OTHER CLIENTS</text>
    <rect x="918" y="116" width="166" height="11" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="1001" y="124" class="tiny muted" text-anchor="middle">PERSONAL FILES</text>
    <rect x="918" y="130" width="166" height="11" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="1001" y="138" class="tiny muted" text-anchor="middle">CREDENTIALS</text>
    <path d="M512 152H1096" class="redline"/>
    <text x="804" y="161" class="tiny red" text-anchor="middle">THE BRIEF ADDS THE WRITTEN RULES &#8212; MAY READ · MAY WRITE · NEVER LEAVES THE VAULT</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">HOW YOU SET IT</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">WRITE THE BOUNDS</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">NEVER-LEAVE LIST</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">OPEN VAULT ROOT</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">ASK IT TO LIST</text>
</svg>
