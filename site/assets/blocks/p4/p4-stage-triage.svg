  <text x="24" y="76" class="micro red">STAGE 02 · TRIAGE</text>
  <text x="24" y="103" class="title">Inbox becomes linked notes</text>
  <text x="24" y="123" class="purpose">Raw captures become titled, linked notes under your ontology &#8212; roads for questions.</text>
  <text x="24" y="142" class="body muted">You approve the titles. Status words like rumor and unreproduced survive.</text>
  <path d="M480 69V151" class="hair"/>
