  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">STAGE 03 · DIRECTOR QUESTIONS</text>
  <text x="24" y="103" class="title">One question, many notes</text>
  <text x="24" y="123" class="purpose">The assistant walks your links and returns one answer whose claims each cite a note.</text>
  <text x="24" y="142" class="body muted">An answer that cites a single note is a summary, not synthesis.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
