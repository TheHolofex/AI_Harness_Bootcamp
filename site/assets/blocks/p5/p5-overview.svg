<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p5-poisoned-corpus-overview">
  <title id="title-p5-poisoned-corpus-overview">P5 overview: rigged intake moves through quarantine and triage; a validated triage candidate becomes the promoted triage record</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P5 · THE POISONED CORPUS</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M110 37H1006" class="hair"/>
  <rect x="24" y="25" width="208" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="128" y="40" class="railtext muted" text-anchor="middle">1 Boundary</text>
  <rect x="240" y="25" width="208" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="344" y="40" class="railtext muted" text-anchor="middle">2 Freeze</text>
  <rect x="456" y="25" width="208" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="560" y="40" class="railtext muted" text-anchor="middle">3 Gate</text>
  <rect x="672" y="25" width="208" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="776" y="40" class="railtext muted" text-anchor="middle">4 Prove</text>
  <rect x="888" y="25" width="208" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="992" y="40" class="railtext muted" text-anchor="middle">5 Close</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">THE MISSION</text>
  <text x="24" y="111" class="title">Poison hits your intake today</text>
  <text x="24" y="132" class="purpose">Seven items hit your intake. The gate — not the assistant — decides whether the candidate is promoted.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Flow from rigged intake through quarantine and triage to the promoted triage record">
    <rect x="24" y="166" width="194" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">RIGGED INTAKE</text>
    <text x="42" y="197" class="tiny muted">7 ITEMS · 3 POISONS</text>
    <path d="M218 186H240" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="250" y="166" width="194" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="268" y="182" class="micro muted">QUARANTINE</text>
    <text x="268" y="197" class="tiny muted">STAGED INTAKE · UNTRUSTED</text>
    <path d="M444 186H466" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="476" y="166" width="204" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="494" y="182" class="micro muted">TRIAGE GATE</text>
    <text x="494" y="197" class="tiny muted">REFERENCE CHECK → CONFIRM</text>
    <path d="M680 186H702" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="712" y="166" width="184" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="730" y="182" class="micro muted">PROVE ABSENCE</text>
    <text x="730" y="197" class="tiny muted">CHECK THE TARGETS</text>
    <path d="M896 186H918" class="line" marker-end="url(#arrow)"/>
    <rect x="928" y="166" width="168" height="40" rx="2" fill="#0A0A0A"/>
    <text x="946" y="182" class="micro white">PROMOTED RECORD</text>
    <text x="946" y="197" class="tiny white">VALIDATED CANDIDATE</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">POISON HELD AT THE GATE</text>
  <text x="68" y="260" class="caption">FALSE CITE · CONTRADICTION · HOSTILE</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">CONTAINMENT = ABSENCE OF EFFECT</text>
  <text x="603" y="260" class="caption">PROVED AT THE TARGET · NOT IN THE CHAT</text>
</svg>
