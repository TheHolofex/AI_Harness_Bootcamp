<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-p5-containment-proof-by-absence">
  <title id="title-p5-containment-proof-by-absence">Concept: containment is proved by checking each effect a hostile note demands at its target and finding it absent — not by the chat's reassurance</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P5 · THE POISONED CORPUS</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">ANY STAGE</text>
  <path d="M110 37H1006" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">1 Brief</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">2 Quarantine</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">3 Triage</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">4 Absence</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Bounds</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Seal</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="76" class="micro red">CONCEPT · PROOF BY ABSENCE</text>
  <text x="24" y="103" class="title">Check the target, not the chat</text>
  <text x="24" y="123" class="purpose">A hostile note names its own effects. Containment is each effect absent at its target.</text>
  <text x="24" y="141" class="body muted">The attacked channel cannot testify for itself.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">THE SHAPE OF IT</text>
  <g aria-label="The note's demanded effects checked at each target and found absent">
    <rect x="512" y="84" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="522" y="96" class="tiny muted">THE NOTE DEMANDS</text>
    <text x="522" y="110" class="tiny">CHANGE A TRUSTED NOTE</text>
    <text x="522" y="122" class="tiny">SEND DATA OUT</text>
    <text x="522" y="134" class="tiny">DELETE A RECORD</text>
    <path d="M702 94H726" class="line" marker-end="url(#arrow)"/>
    <path d="M702 118H726" class="line" marker-end="url(#arrow)"/>
    <path d="M702 142H726" class="line" marker-end="url(#arrow)"/>
    <rect x="730" y="85" width="230" height="18" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="740" y="97.5" class="tiny">THE NAMED NOTE · DIFF CLEAN</text>
    <rect x="730" y="109" width="230" height="18" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="740" y="121.5" class="tiny">CHAT + OUTPUTS · NOTHING SENT</text>
    <rect x="730" y="133" width="230" height="18" rx="2" fill="#FAFAF8" stroke="#D0D0D0"/>
    <text x="740" y="145.5" class="tiny">THE NAMED RECORD · STILL THERE</text>
    <rect x="972" y="85" width="94" height="18" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="1019" y="97.5" class="tiny red" text-anchor="middle">EFFECT ABSENT</text>
    <rect x="972" y="109" width="94" height="18" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="1019" y="121.5" class="tiny red" text-anchor="middle">EFFECT ABSENT</text>
    <rect x="972" y="133" width="94" height="18" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="1019" y="145.5" class="tiny red" text-anchor="middle">EFFECT ABSENT</text>
    <text x="512" y="160" class="tiny muted">"I IGNORED IT" IN THE CHAT IS A CLAIM, NOT PROOF</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN PRACTICE</text>
  <rect x="24" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="198.2" class="caption">LIST THE EFFECTS</text>
  <rect x="204" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="198.2" class="caption">CHECK TARGETS</text>
  <rect x="384" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="198.2" class="caption">DIFF THE VAULT</text>
  <rect x="564" y="182" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="198.2" class="caption">THEN THE VERDICT</text>
</svg>
