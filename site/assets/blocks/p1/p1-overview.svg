<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-p1-overview">
  <title id="title-p1-overview">P1 whole-block overview: a corpus folder feeds a regenerable machine that produces a cited brief, probed by delta rerun and stale-source test, ending in an operator verdict</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">P1 · THE DAILY STATUS BRIEF</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE BLOCK</text>
  <path d="M110.5 37H1005.5" class="hair"/>
  <rect x="24" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="110.5" y="40" class="railtext muted" text-anchor="middle">1 Contract</text>
  <rect x="203" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="289.5" y="40" class="railtext muted" text-anchor="middle">2 Corpus</text>
  <rect x="382" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="468.5" y="40" class="railtext muted" text-anchor="middle">3 Machine</text>
  <rect x="561" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="647.5" y="40" class="railtext muted" text-anchor="middle">4 Audit</text>
  <rect x="740" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="826.5" y="40" class="railtext muted" text-anchor="middle">5 Probes</text>
  <rect x="919" y="25" width="173" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1005.5" y="40" class="railtext muted" text-anchor="middle">6 Verdict</text>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="78" class="micro red">THE WHOLE RUN</text>
  <text x="24" y="105" class="title">The machine that makes the answer</text>
  <text x="24" y="126" class="purpose">A folder of reports in; a cited brief out — on command, every time the world changes.</text>
  <path d="M24 147H1096" class="hair"/>
  <g aria-label="Flow from corpus through machine and brief to probes and verdict">
    <rect x="24" y="157" width="180" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="42" y="173" class="micro muted">01 · CORPUS</text>
    <text x="42" y="188" class="tiny muted">C1…C6 + DELTA_patch</text>
    <path d="M204 177H226" class="line" marker-end="url(#arrow)"/>
    <rect x="236" y="157" width="200" height="40" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
    <text x="254" y="173" class="micro muted">02 · THE MACHINE</text>
    <text x="254" y="188" class="tiny muted">ONE SAVED COMMAND</text>
    <path d="M436 177H458" class="line" marker-end="url(#arrow)"/>
    <rect x="468" y="157" width="200" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="486" y="173" class="micro muted">03 · CITED BRIEF</text>
    <text x="486" y="188" class="tiny muted">EVERY CLAIM WEARS [C#]</text>
    <path d="M668 177H690" class="line" marker-end="url(#arrow)"/>
    <rect x="700" y="157" width="196" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="718" y="173" class="micro muted">04 · TWO PROBES</text>
    <text x="718" y="188" class="tiny muted">DELTA RERUN · STALE TEST</text>
    <path d="M896 177H918" class="line" marker-end="url(#arrow)"/>
    <rect x="928" y="157" width="168" height="40" rx="2" fill="#0A0A0A"/>
    <text x="946" y="173" class="micro white">05 · VERDICT</text>
    <text x="946" y="188" class="tiny white">ACCEPT ON EVIDENCE</text>
    <path d="M798 197V207H336V199" class="redline dash" marker-end="url(#arrow-red)"/>
    <text x="567" y="216" class="tiny red" text-anchor="middle">REGENERATE — DON'T RE-ARGUE</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <text x="24" y="233" class="micro muted">IN THIS BLOCK</text>
  <rect x="24" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.5" y="256.3" class="caption white" text-anchor="middle">01</text>
  <text x="58" y="256.2" class="caption">CONTRACT</text>
  <rect x="204" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="204" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="216.5" y="256.3" class="caption white" text-anchor="middle">02</text>
  <text x="238" y="256.2" class="caption">CORPUS</text>
  <rect x="384" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="384" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="396.5" y="256.3" class="caption white" text-anchor="middle">03</text>
  <text x="418" y="256.2" class="caption">MACHINE</text>
  <rect x="564" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.5" y="256.3" class="caption white" text-anchor="middle">04</text>
  <text x="598" y="256.2" class="caption">AUDIT</text>
  <rect x="744" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="744" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="756.5" y="256.3" class="caption white" text-anchor="middle">05</text>
  <text x="778" y="256.2" class="caption">PROBES</text>
  <rect x="924" y="240" width="172" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="924" y="240" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="936.5" y="256.3" class="caption white" text-anchor="middle">06</text>
  <text x="958" y="256.2" class="caption">VERDICT</text>
</svg>
