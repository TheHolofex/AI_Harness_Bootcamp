<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title-install-pre-work-journey-overview">
  <title id="title-install-pre-work-journey-overview">Install pre-work journey overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">PRE-WORK · GETTING SET UP</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE PATH</text>
  <path d="M55 37H1060" class="hair"/>
  <rect x="24" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="55" y="40" class="railtext muted" text-anchor="middle">BYB</text>
  <rect x="91" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="122" y="40" class="railtext muted" text-anchor="middle">0 Base</text>
  <rect x="158" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="189" y="40" class="railtext muted" text-anchor="middle">1 Term</text>
  <rect x="225" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="256" y="40" class="railtext muted" text-anchor="middle">2 Installers</text>
  <rect x="292" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="323" y="40" class="railtext muted" text-anchor="middle">3 Git + repo</text>
  <rect x="359" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="390" y="40" class="railtext muted" text-anchor="middle">4 Runtime</text>
  <rect x="426" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="457" y="40" class="railtext muted" text-anchor="middle">5 Keys</text>
  <rect x="493" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="524" y="40" class="railtext muted" text-anchor="middle">6 Smoke</text>
  <rect x="560" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="591" y="40" class="railtext muted" text-anchor="middle">7 Codex</text>
  <rect x="627" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="658" y="40" class="railtext muted" text-anchor="middle">8 OpenCode</text>
  <rect x="694" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="725" y="40" class="railtext muted" text-anchor="middle">9 Pi</text>
  <rect x="761" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="792" y="40" class="railtext muted" text-anchor="middle">10 goose</text>
  <rect x="828" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="859" y="40" class="railtext muted" text-anchor="middle">11 Obsidian</text>
  <rect x="895" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="926" y="40" class="railtext muted" text-anchor="middle">12 n8n</text>
  <rect x="962" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="993" y="40" class="railtext muted" text-anchor="middle">13 Files</text>
  <rect x="1029" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#A58650" stroke-width="1.4"/>
  <text x="1060" y="40" class="railtext gold" text-anchor="middle">14 Claude*</text>
  <circle cx="31" cy="37" r="2.6" fill="#E31C23"/>
  <text x="39" y="53" class="tiny red">START</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="82" class="micro red">MONDAY MORNING · INSTALL CLINIC</text>
  <text x="24" y="111" class="title">Install and verify the course harnesses and tools.</text>
  <text x="24" y="132" class="purpose">Work through four large phases with the instructor. Each phase ends with a result you can see.</text>
  <path d="M24 153H1096" class="hair"/>
  <g aria-label="Four install phases">
    <rect x="24" y="166" width="235" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <rect x="24" y="166" width="7" height="40" fill="#E31C23"/>
    <text x="42" y="182" class="micro muted">01 · PREPARE THE MACHINE</text>
    <text x="42" y="197" class="tiny muted">WINDOWS · GIT + REPO · RUNTIMES</text>
    <path d="M259 186H277" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="287" y="166" width="235" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="305" y="182" class="micro muted">02 · INSTALL THE KEYS</text>
    <text x="305" y="197" class="tiny muted">OPENAI · XAI · ANTHROPIC</text>
    <path d="M522 186H540" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="550" y="166" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="568" y="182" class="micro muted">03 · HARNESSES + TOOLS</text>
    <text x="568" y="197" class="tiny muted">CODEX · OPENCODE · PI · GOOSE</text>
    <path d="M810 186H828" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="838" y="166" width="258" height="40" rx="2" fill="#0A0A0A"/>
    <text x="856" y="182" class="micro white">04 · COURSE FILES</text>
    <text x="856" y="197" class="tiny white">OPERATOR FILES · LOCAL SITE · SAFE KEYS</text>
  </g>
  <rect x="0" y="220" width="1120" height="60" fill="#FAFAF8"/>
  <rect x="24" y="232" width="515" height="36" rx="2" fill="#FFFFFF" stroke="#1A1A1A"/>
  <circle cx="48" cy="250" r="7" fill="#0A0A0A"/>
  <text x="68" y="247" class="micro muted">COMPLETE TOGETHER</text>
  <text x="68" y="260" class="caption">MONDAY MORNING · INSTALL CLINIC</text>
  <rect x="557" y="232" width="539" height="36" rx="2" fill="#FFFFFF" stroke="#E31C23" stroke-width="1.5"/>
  <circle cx="581" cy="250" r="7" fill="#E31C23"/>
  <path d="M577 250l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="603" y="247" class="micro red">VERIFIED = FOUR FILES + COURSE OPENS</text>
  <text x="603" y="260" class="caption">CODEX · OPENCODE · PI · GOOSE</text>
</svg>
