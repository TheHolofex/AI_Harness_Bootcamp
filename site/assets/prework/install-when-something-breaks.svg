  <text x="658" y="40" class="railtext muted" text-anchor="middle">8 OpenCode</text>
  <rect x="694" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="725" y="40" class="railtext muted" text-anchor="middle">9 Pi</text>
  <rect x="761" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="792" y="40" class="railtext muted" text-anchor="middle">10 goose</text>
  <rect x="828" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="859" y="40" class="railtext muted" text-anchor="middle">11 Obsidian</text>
  <rect x="895" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="926" y="40" class="railtext muted" text-anchor="middle">12 n8n</text>
  <rect x="962" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="993" y="40" class="railtext muted" text-anchor="middle">13 Files</text>
  <rect x="1029" y="25" width="62" height="24" rx="2" fill="#FFFFFF" stroke="#A58650" stroke-width="1.4"/>
  <text x="1060" y="40" class="railtext gold" text-anchor="middle">14 Claude*</text>
  <path d="M24 52V54H1091V52" class="redline"/>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">INSTALL CHECKLIST</text>
  <text x="24" y="103" class="title">When something breaks</text>
  <text x="24" y="123" class="purpose">Copy the full error, fix the environment, and re-run the check.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">WHAT THIS LOOKS LIKE</text>
  <g aria-label="Repair loop from error to paste to fix to shown result">
    <rect x="533" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="591" y="112" class="micro red" text-anchor="middle">ERROR</text>
    <text x="591" y="127" class="caption" text-anchor="middle">EXACT TEXT</text>
    <rect x="674" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="732" y="112" class="micro muted" text-anchor="middle">PASTE</text>
    <text x="732" y="127" class="caption" text-anchor="middle">WHOLE OUTPUT</text>
    <rect x="815" y="93" width="116" height="45" rx="2" fill="#0A0A0A"/>
    <text x="873" y="112" class="micro white" text-anchor="middle">FIX</text>
    <text x="873" y="127" class="caption white" text-anchor="middle">ONE CHANGE</text>
    <rect x="956" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="1014" y="112" class="micro muted" text-anchor="middle">SHOW</text>
    <text x="1014" y="127" class="caption" text-anchor="middle">RESULT</text>
    <path d="M649 116H674M790 116H815M931 116H956" class="redline" marker-end="url(#arrow-red)"/>
    <path d="M1014 93V75H591V93" class="hair" marker-end="url(#arrow)"/>
    <text x="803" y="70" class="tiny red" text-anchor="middle">RETRY FROM A FRESH WINDOW · ESCALATE AT 30 MINUTES</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">IN THIS SECTION</text>
