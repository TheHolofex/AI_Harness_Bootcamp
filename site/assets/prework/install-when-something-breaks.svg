<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title-install-pre-work-when-something-breaks">
  <title id="title-install-pre-work-when-something-breaks">Install pre-work: When something breaks</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="220" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">PRE-WORK · INSTALL PATH</text>
  <text x="1096" y="13" class="micro red" text-anchor="end">RECOVERY · ANY STAGE</text>
  <path d="M53 37H1061" class="hair"/>
  <rect x="24" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="53" y="40" class="railtext muted" text-anchor="middle">BYB</text>
  <rect x="87" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="116" y="40" class="railtext muted" text-anchor="middle">0 Base</text>
  <rect x="150" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="179" y="40" class="railtext muted" text-anchor="middle">1 Term</text>
  <rect x="213" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="242" y="40" class="railtext muted" text-anchor="middle">2 winget</text>
  <rect x="276" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="305" y="40" class="railtext muted" text-anchor="middle">3 Git</text>
  <rect x="339" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="368" y="40" class="railtext muted" text-anchor="middle">4 Runtime</text>
  <rect x="402" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="431" y="40" class="railtext muted" text-anchor="middle">5 Keys</text>
  <rect x="465" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="494" y="40" class="railtext muted" text-anchor="middle">6 Smoke</text>
  <rect x="528" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="557" y="40" class="railtext muted" text-anchor="middle">7 Codex</text>
  <rect x="591" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="620" y="40" class="railtext muted" text-anchor="middle">8 OpenCode</text>
  <rect x="654" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="683" y="40" class="railtext muted" text-anchor="middle">9 Pi</text>
  <rect x="717" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="746" y="40" class="railtext muted" text-anchor="middle">10 goose</text>
  <rect x="780" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="809" y="40" class="railtext muted" text-anchor="middle">11 Obsidian</text>
  <rect x="843" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="872" y="40" class="railtext muted" text-anchor="middle">12 n8n</text>
  <rect x="906" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="935" y="40" class="railtext muted" text-anchor="middle">13 Repo</text>
  <rect x="969" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#A58650" stroke-width="1.4"/>
  <text x="998" y="40" class="railtext gold" text-anchor="middle">14 Claude*</text>
  <rect x="1032" y="25" width="58" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1061" y="40" class="railtext muted" text-anchor="middle">15 Gate</text>
  <path d="M24 52V54H1090V52" class="redline"/>
  <path d="M0 56H1120" class="hair"/>
  <text x="24" y="76" class="micro red">INSTALL STAGE</text>
  <text x="24" y="103" class="title">RUN THE REPAIR LOOP</text>
  <text x="24" y="123" class="purpose">Capture the exact failure, fix the environment, and log it.</text>
  <path d="M480 69V151" class="hair"/>
  <text x="512" y="76" class="micro muted">STAGE VIEW</text>
  <g aria-label="Repair loop from error to paste to fix to log">
    <rect x="533" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="591" y="112" class="micro red" text-anchor="middle">ERROR</text>
    <text x="591" y="127" class="caption" text-anchor="middle">EXACT TEXT</text>
    <rect x="674" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="732" y="112" class="micro muted" text-anchor="middle">PASTE</text>
    <text x="732" y="127" class="caption" text-anchor="middle">WHOLE OUTPUT</text>
    <rect x="815" y="93" width="116" height="45" rx="2" fill="#0A0A0A"/>
    <text x="873" y="112" class="micro white" text-anchor="middle">FIX</text>
    <text x="873" y="127" class="caption white" text-anchor="middle">ONE CHANGE</text>
    <rect x="956" y="93" width="116" height="45" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="1014" y="112" class="micro muted" text-anchor="middle">LOG</text>
    <text x="1014" y="127" class="caption" text-anchor="middle">RESULT</text>
    <path d="M649 116H674M790 116H815M931 116H956" class="redline" marker-end="url(#arrow-red)"/>
    <path d="M1014 93V75H591V93" class="hair" marker-end="url(#arrow)"/>
    <text x="803" y="70" class="tiny red" text-anchor="middle">RETRY FROM A FRESH WINDOW · ESCALATE AT 30 MINUTES</text>
  </g>
  <rect x="0" y="164" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="175" class="micro muted">SECTION RUN</text>
  <rect x="24.00" y="182" width="208.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="24.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="36.50" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58.00" y="198.2" class="caption">COMMAND MISSING</text>
  <rect x="240.00" y="182" width="208.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="240.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="252.50" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="274.00" y="198.2" class="caption">SCRIPTS BLOCKED</text>
  <rect x="456.00" y="182" width="208.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="456.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="468.50" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="490.00" y="198.2" class="caption">AUTH FAILS</text>
  <rect x="672.00" y="182" width="208.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="672.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="684.50" y="198.3" class="caption white" text-anchor="middle">04</text>
  <text x="706.00" y="198.2" class="caption">FILE MISSING</text>
  <rect x="888.00" y="182" width="208.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="888.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="900.50" y="198.3" class="caption white" text-anchor="middle">05</text>
  <text x="922.00" y="198.2" class="caption">ESCALATE AT 30 MIN</text>
</svg>
