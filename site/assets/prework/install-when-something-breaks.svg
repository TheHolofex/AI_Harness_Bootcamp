  <text x="36.50" y="198.3" class="caption white" text-anchor="middle">01</text>
  <text x="58.00" y="198.2" class="caption">COPY ERROR</text>
  <rect x="294.00" y="182" width="262.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="294.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="306.50" y="198.3" class="caption white" text-anchor="middle">02</text>
  <text x="328.00" y="198.2" class="caption">FIX ENV</text>
  <rect x="564.00" y="182" width="262.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="564.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="576.50" y="198.3" class="caption white" text-anchor="middle">03</text>
  <text x="598.00" y="198.2" class="caption">RE-TEST</text>
  <rect x="834.00" y="182" width="262.00" height="25" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
  <rect x="834.00" y="182" width="25" height="25" rx="2" fill="#0A0A0A"/>
  <text x="846.50" y="198.3" class="caption white" text-anchor="middle">04</text>
