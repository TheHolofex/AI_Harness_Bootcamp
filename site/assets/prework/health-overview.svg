<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title-health-gate-journey-overview">
  <title id="title-health-gate-journey-overview">Health gate journey overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#0A0A0A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#E31C23"/>
    </marker>
    <style>
      text { font-family: system-ui, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0A0A0A; }
      .micro { font-size: 8px; font-weight: 650; letter-spacing: 1.65px; }
      .tiny { font-size: 7px; font-weight: 650; letter-spacing: 1px; }
      .railtext { font-size: 7.1px; font-weight: 650; }
      .title { font-size: 21px; font-weight: 680; letter-spacing: -0.25px; }
      .purpose { font-size: 11.5px; font-weight: 430; fill: #4A4A4A; }
      .caption { font-size: 8.5px; font-weight: 650; letter-spacing: 1.15px; }
      .body { font-size: 9.5px; font-weight: 520; }
      .muted { fill: #6B6B6B; }
      .white { fill: #FFFFFF; }
      .red { fill: #E31C23; }
      .gold { fill: #A58650; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .hair { fill: none; stroke: #D0D0D0; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .redline { fill: none; stroke: #E31C23; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
      .goldline { fill: none; stroke: #A58650; stroke-width: 1.35; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1120" height="240" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="56" fill="#FAFAF8"/>
  <text x="24" y="13" class="micro muted">PRE-WORK · HEALTH CHECK</text>
  <text x="1096" y="13" class="micro muted" text-anchor="end">WHOLE PATH</text>
  <path d="M97 37H1033" class="hair"/>
  <rect x="28" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="97" y="40" class="railtext muted" text-anchor="middle">Run</text>
  <rect x="184" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="253" y="40" class="railtext muted" text-anchor="middle">A Found</text>
  <rect x="340" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="409" y="40" class="railtext muted" text-anchor="middle">B Keys</text>
  <rect x="496" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="565" y="40" class="railtext muted" text-anchor="middle">C Agents</text>
  <rect x="652" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="721" y="40" class="railtext muted" text-anchor="middle">D Support</text>
  <rect x="808" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="877" y="40" class="railtext muted" text-anchor="middle">E Ready</text>
  <rect x="964" y="25" width="138" height="24" rx="2" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="1033" y="40" class="railtext muted" text-anchor="middle">Result</text>
  <circle cx="35" cy="37" r="2.6" fill="#E31C23"/>
  <text x="43" y="53" class="tiny red">START</text>
  <path d="M0 56H1120" class="hair"/>

  <text x="24" y="80" class="micro red">ABOUT HALF AN HOUR · BE HONEST</text>
  <text x="24" y="107" class="title">Open a fresh terminal. Check everything. Say how it went.</text>
  <text x="24" y="127" class="purpose">Start from a new terminal. Confirm foundations, keys, four agent files, and the supporting tools — then mark GREEN, YELLOW, or RED.</text>
  <path d="M24 145H1096" class="hair"/>
  <g aria-label="Health gate flow">
    <rect x="24" y="158" width="151" height="34" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="99.5" y="172" class="tiny muted" text-anchor="middle">FRESH RUN</text>
    <text x="99.5" y="185" class="caption" text-anchor="middle">LAPTOP + LOG</text>
    <path d="M175 175H208" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="218" y="158" width="151" height="34" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="293.5" y="172" class="tiny muted" text-anchor="middle">FOUNDATIONS</text>
    <text x="293.5" y="185" class="caption" text-anchor="middle">TOOLS ANSWER</text>
    <path d="M369 175H402" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="412" y="158" width="151" height="34" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="487.5" y="172" class="tiny muted" text-anchor="middle">CREDENTIALS</text>
    <text x="487.5" y="185" class="caption" text-anchor="middle">3 KEYS FUNDED</text>
    <path d="M563 175H596" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="606" y="151" width="181" height="48" rx="2" fill="#0A0A0A"/>
    <text x="696.5" y="170" class="micro white" text-anchor="middle">FOUR AGENT FILES</text>
    <text x="696.5" y="187" class="caption white" text-anchor="middle">REGENERATED TOGETHER</text>
    <path d="M787 175H820" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="830" y="158" width="124" height="34" rx="2" fill="#FFFFFF" stroke="#D0D0D0"/>
    <text x="892" y="172" class="tiny muted" text-anchor="middle">SUPPORT</text>
    <text x="892" y="185" class="caption" text-anchor="middle">TOOLS READY</text>
    <path d="M954 175H987" class="redline" marker-end="url(#arrow-red)"/>
    <rect x="997" y="151" width="99" height="48" rx="2" fill="#FFFFFF" stroke="#E31C23"/>
    <text x="1046.5" y="170" class="micro red" text-anchor="middle">RESULT</text>
    <text x="1046.5" y="187" class="caption" text-anchor="middle">HONEST</text>
  </g>
  <rect x="0" y="213" width="1120" height="27" fill="#FAFAF8"/>
  <circle cx="401" cy="226.5" r="5" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="415" y="230" class="tiny">GREEN</text>
  <circle cx="516" cy="226.5" r="5" fill="#A58650"/>
  <text x="530" y="230" class="tiny gold">AMBER</text>
  <circle cx="634" cy="226.5" r="5" fill="#E31C23"/>
  <text x="648" y="230" class="tiny red">RED</text>
  <text x="765" y="230" class="tiny muted">RECORD THE RUN · PACK FOR MONDAY</text>
</svg>
